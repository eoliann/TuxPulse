name: Notify Telegram on Release

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository whose release is announced (owner/name)"
        default: "eoliann/TuxPulse"
        required: true
      tag:
        description: "Release tag (empty = latest release)"
        default: ""
        required: false
      dry_run:
        description: "Only check that the bot can reach every chat (no message is sent)"
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest

    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      # Repo-ul are secretul TG_CHAT_ID; TG_CHATS (listă separată prin virgulă) are prioritate dacă există
      TG_CHATS: ${{ secrets.TG_CHATS || secrets.TG_CHAT_ID }}

    steps:
      - name: Read release details
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            jq '.release' "$GITHUB_EVENT_PATH" > release.json
          elif [ -n "$INPUT_TAG" ]; then
            gh api "repos/${INPUT_REPO}/releases/tags/${INPUT_TAG}" > release.json
          else
            gh api "repos/${INPUT_REPO}/releases/latest" > release.json
          fi
          jq -r '"Release: \(.name) (\(.tag_name)) \(.html_url)", (.assets[] | "Asset: \(.name)")' release.json

      - name: Check chats (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          IFS=',' read -r -a CHAT_ARRAY <<< "${TG_CHATS}"
          FAILED=0
          for ITEM in "${CHAT_ARRAY[@]}"; do
            CHAT_ID="$(echo "${ITEM%%:*}" | xargs)"
            [ -z "$CHAT_ID" ] && continue
            RESPONSE="$(curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/getChat" -d chat_id="${CHAT_ID}")"
            if [ "$(echo "$RESPONSE" | jq -r '.ok')" = "true" ]; then
              echo "OK: $(echo "$RESPONSE" | jq -r '.result | "\(.title) (\(.id)) forum=\(.is_forum // false)"')"
            else
              echo "::error::Cannot reach chat: $(echo "$RESPONSE" | jq -r '.description')"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Send Telegram notifications
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "${TG_BOT_TOKEN}" ] || [ -z "${TG_CHATS}" ]; then
            echo "::error::TG_BOT_TOKEN or TG_CHATS/TG_CHAT_ID secret is missing."
            exit 1
          fi

          RELEASE_NAME="$(jq -r '.name // .tag_name' release.json)"
          RELEASE_TAG="$(jq -r '.tag_name' release.json)"
          RELEASE_URL="$(jq -r '.html_url' release.json)"

          # TuxPulse2 nu e scris în Python, așa că descrierea diferă
          if [[ "$RELEASE_URL" == *"/TuxPulse2/"* ]]; then
            DESCRIPTION="👉 Un set de instrumente rapid pentru Linux, care include comenzi de administrare utile și ajustări pentru optimizarea și curățarea sistemului."
          else
            DESCRIPTION="👉 Un set de instrumente rapid pentru Linux, scris în Python, care include comenzi de administrare utile și ajustări pentru optimizarea și curățarea sistemului."
          fi

          # Construim textul cu newline-uri reale (Telegram HTML nu acceptă <br>)
          TEXT="$(printf '%s\n' \
            '📢 <b>TuxPulse are o nouă versiune pe GitHub!</b>' \
            "<b>${RELEASE_NAME}</b> (tag: <code>${RELEASE_TAG}</code>)" \
            "" \
            "${DESCRIPTION}" \
            "Cod gratuit și curat, fără spyware, malware sau reclame." \
            "" \
            "👉 <a href=\"${RELEASE_URL}\">Mergi la pagina noii versiuni</a>" \
          )"

          # Câte un link de descărcare pentru fiecare pachet (.deb / .rpm / Arch)
          while IFS=$'\t' read -r NAME URL; do
            [ -z "$URL" ] && continue
            TEXT+=$'\n'"⬇️ <a href=\"${URL}\">Descarcă ${NAME}</a>"
          done < <(jq -r '.assets[] | select(.name | test("[.](deb|rpm|pkg[.]tar[.](zst|xz))$")) | [.name, .browser_download_url] | @tsv' release.json)

          IFS=',' read -r -a CHAT_ARRAY <<< "${TG_CHATS}"

          SENT=0
          for ITEM in "${CHAT_ARRAY[@]}"; do
            ITEM_TRIM=$(echo "$ITEM" | xargs)
            [ -z "$ITEM_TRIM" ] && continue

            ARGS=(-d parse_mode="HTML" --data-urlencode "text=${TEXT}")
            if [[ "$ITEM_TRIM" == *":"* ]]; then
              ARGS+=(-d chat_id="${ITEM_TRIM%%:*}" -d message_thread_id="${ITEM_TRIM##*:}")
            else
              ARGS+=(-d chat_id="${ITEM_TRIM}")
            fi

            RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" "${ARGS[@]}")"
            if [ "$(echo "$RESPONSE" | jq -r '.ok')" = "true" ]; then
              SENT=$((SENT+1))
            else
              echo "::error::Telegram rejected the message for ${ITEM_TRIM}: $(echo "$RESPONSE" | jq -r '.description')"
            fi
          done

          echo "Messages sent: ${SENT}"
          [ "$SENT" -gt 0 ]
