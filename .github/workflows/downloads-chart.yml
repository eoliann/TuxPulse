name: Downloads chart

on:
  schedule:
    - cron: "17 3 * * *"
  release:
    types: [published, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update downloads history and chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/downloads_chart.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/downloads
          git diff --cached --quiet || (git commit -m "chore: update downloads chart [skip ci]" && git push)
