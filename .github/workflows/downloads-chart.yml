name: Downloads chart

on:
  schedule:
    - cron: "17 3 * * *"
  release:
    types: [published, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Update downloads history and charts (branch downloads-data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --quiet --depth 1 --branch downloads-data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          cd data
          python3 downloads_chart.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: update downloads charts" && git push origin downloads-data)
